<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrowz — generator lab</title>
<style>
  :root { color-scheme: light; --ink: #232447; --paper: #f6f6fa; --accent: #e8467c; --line: #e3e3ec; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fbfbfd; color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         display: grid; grid-template-columns: 350px 1fr; height: 100vh; }

  aside { overflow-y: auto; padding: 1rem 1.1rem 4rem; border-right: 1px solid var(--line); background: #fff; }
  /* The board takes all free space, the stats have their own column.
     On a narrow screen the columns collapse into one. */
  /* min-height: 0 at every level — without it a grid item grows with its
     content and the board fits the width instead of the window height. */
  /* FOUR rows, because main has four children: tabs, status, progress bar
     and the columns. With fewer defined rows the board got a row the height
     of the progress bar and half the screen was wasted. */
  main { overflow: hidden; padding: .8rem 1.1rem; display: grid;
         grid-template-rows: auto auto auto minmax(0, 1fr); gap: .3rem; min-height: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 26rem; gap: 1.5rem;
          min-height: 0; overflow: hidden; }
  @media (max-width: 1500px) { .cols { grid-template-columns: 1fr; overflow: auto; } }

  h1 { font-size: 1.1rem; margin: 0 0 .2rem; }
  .sub { color: #6a6b86; font-size: 12px; margin: 0 0 1rem; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: #6a6b86;
       margin: 1.4rem 0 .5rem; padding-top: .7rem; border-top: 1px solid var(--line); }
  details.group { border-top: 1px solid var(--line); padding-top: .35rem; margin-top: .55rem; }
  details.group > summary { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em;
                            color: #6a6b86; cursor: pointer; padding: .25rem 0; list-style: none; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: '▸ '; display: inline-block; width: 1em; }
  details.group[open] > summary::before { content: '▾ '; }
  details.group > summary:hover { color: var(--ink); }
  td.delta { color: #7a7b95; font-size: 11.5px; padding-left: .6rem; }
  td.delta.up { color: #2b6b3f; }
  td.delta.down { color: #8a2b2b; }

  .langs { float: right; display: flex; gap: .2rem; }
  .langs button { padding: .1rem .4rem; font-size: 11px; }
  .langs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Simple / advanced view. The simple view replaces the presets and the
     knob panel with a few plain choices (lab-simple.ts); the export-only
     knobs (advonly) go too. Both views share the same state. */
  .views { display: flex; gap: .3rem; margin: 0 0 .7rem; }
  .views button { flex: 1; padding: .25rem .5rem; font-size: 12.5px; }
  .views button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  body.simple #presets, body.simple #params, body.simple .advonly { display: none; }
  body:not(.simple) #simple { display: none; }
  .slabel { display: block; font-size: 12.5px; margin-bottom: .25rem; }
  .sslider { width: 100%; margin: 0; display: block; }
  .sends { display: flex; justify-content: space-between; font-size: 11px; color: #7a7b95; margin: 0 0 .6rem; }
  .seg { display: flex; gap: .25rem; margin-bottom: .6rem; }
  .seg button { flex: 1; padding: .25rem .3rem; font-size: 12px; }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .row { display: grid; grid-template-columns: 1fr 68px; gap: .5rem; align-items: center; margin-bottom: .35rem; }
  .row label { font-size: 12.5px; }
  .row input[type=number] { width: 100%; padding: .2rem .3rem; border: 1px solid var(--line); border-radius: 4px;
                            font: inherit; font-size: 12.5px; text-align: right; }
  .row input[type=range] { grid-column: 1 / -1; margin: 0 0 .3rem; }
  .check { display: flex; gap: .45rem; align-items: center; margin-bottom: .4rem; font-size: 12.5px; }
  .help { grid-column: 1 / -1; margin: -.15rem 0 .7rem; font-size: 11.5px; line-height: 1.45; color: #7a7b95; }
  .help b { color: #5a5b78; }
  .grouphelp { font-size: 11.5px; line-height: 1.45; color: #7a7b95; margin: -.2rem 0 .7rem; }
  body.nohelp .help, body.nohelp .grouphelp { display: none; }

  button { font: inherit; padding: .35rem .7rem; border: 1px solid var(--line); background: #fff;
           border-radius: 5px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .buttons { display: flex; gap: .4rem; flex-wrap: wrap; margin: .7rem 0; }
  .presets { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .presets button { padding: .2rem .45rem; font-size: 12px; }
  select#presets { display: block; width: 100%; font: inherit; font-size: 13px; padding: .3rem .4rem;
                   border: 1px solid var(--line); border-radius: 5px; background: #fff; }
  button.danger { color: #8a2b2b; border-color: #e6c3c3; }
  button.danger.armed { background: #8a2b2b; color: #fff; border-color: #8a2b2b; }

  .command { margin: 0 0 .6rem; }
  .cmdhead { display: flex; justify-content: space-between; align-items: center; gap: .5rem;
             font-size: 11.5px; color: #6a6b86; margin-bottom: .25rem; }
  .cmdhead button { padding: .1rem .45rem; font-size: 11.5px; }
  #command, #libCommand { margin: 0; padding: .45rem .55rem; background: #eeeef5; border-radius: 5px;
             font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
             white-space: pre-wrap; word-break: break-all; user-select: all; }

  .tabs { display: flex; gap: .3rem; margin-bottom: .2rem; }
  .tabs button { border-radius: 5px 5px 0 0; border-bottom: none; padding: .3rem .8rem; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  body.tab-library #stats, body.tab-library #topTable { display: none; }
  /* The saved-boards tab only browses the store: no presets, no generator
     knobs. The panel keeps what acts on the stored board — the board's
     command, and stroke, head and colour rows in the place of the lab's. */
  body.tab-library .labonly, body.tab-library #presets { display: none; }   /* #presets: the id rule above outranks the class */
  body:not(.tab-library) .libonly { display: none; }
  .libhead { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
  .libhead button { padding: .2rem .45rem; font-size: 12px; }
  #libList { margin: .4rem 0 .8rem; }
  .boardrow { display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem; padding: .35rem .5rem;
              border: 1px solid var(--line); border-radius: 5px; margin-bottom: .3rem; cursor: pointer; font-size: 12px; }
  .boardrow:hover { border-color: var(--ink); }
  .boardrow.on { border-color: var(--accent); background: #fff5f8; }
  .boardrow .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .boardrow .meta { color: #6a6b86; grid-column: 1 / -1; }

  /* The bar stays in the layout and only toggles visibility — hiding it
     would change the row height and the board would jump at start and end. */
  #progress { height: 4px; background: var(--line); border-radius: 2px; margin: .25rem 0 0;
              overflow: hidden; visibility: hidden; }
  #progress.on { visibility: visible; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
  /* The board element pans and zooms inside this box and sizes itself to it;
     the box only has to have a size. The pixel cell size concerns only the
     downloaded SVG and the CLI command. */
  #boardWrap { background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
               overflow: hidden; min-height: 0; position: relative; }
  /* Stacked under 1500px, the row is as tall as its content, and the element
     has none of its own (the old SVG did): the box takes most of the window. */
  @media (max-width: 1500px) { #boardWrap { height: 75vh; } }
  /* Full view: the panel and stats disappear, the board gets the whole window.
     On a square board that is 1003 → 1828 px on a 4K screen. */
  /* One column, not "0 1fr": with the panel hidden, main landed in a
     zero-width column and the board vanished. */
  body.solo { grid-template-columns: 1fr; }
  body.solo aside, body.solo #side { display: none; }
  body.solo .cols { grid-template-columns: 1fr; }
  #solo { position: fixed; right: 1rem; top: .7rem; z-index: 5; opacity: .55; }
  #solo:hover { opacity: 1; }
  #board { position: absolute; inset: 0; }
  /* Fixed height and no wrapping: a growing progress message would shift the
     board on every update. */
  .status { height: 1.3rem; line-height: 1.3rem; font-size: 13px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .bad { color: #8a2b2b; font-weight: 600; }
  .status .good { color: #2b6b3f; }

  table.stats { border-collapse: collapse; font-size: 12.5px; margin-bottom: 1rem; }
  table.stats td { padding: .15rem .9rem .15rem 0; }
  table.stats td:first-child { color: #6a6b86; }
  table.stats td.num { font-variant-numeric: tabular-nums; }
  table.top { border-collapse: collapse; font-size: 12px; margin-top: .3rem; }
  table.top th { text-align: left; color: #6a6b86; font-weight: 500; padding-right: .9rem; }
  table.top td { padding: .1rem .9rem .1rem 0; font-variant-numeric: tabular-nums; }
  #side { overflow-y: auto; min-height: 0; padding-right: .5rem; }
  code { background: #eeeef5; padding: .1em .35em; border-radius: 4px; font-size: 12px; }
  .row.inactive { opacity: .4; }
  .row.inactive .help::before { content: attr(data-why); color: #b3462f; }
  /* A knob outside the safe envelope: red left border and the reason as a
     red prefix of its help, the same data-why channel as an inactive knob.
     The violation wins over dimming, because it blocks Generate. */
  .row.violation { border-left: 3px solid #c0392b; padding-left: .45rem; margin-left: -.6rem; opacity: 1; }
  .row.violation .help::before { content: attr(data-why); color: #c0392b; font-weight: 600; }
  #violations { border-left: 3px solid #c0392b; background: #fdf3f2; border-radius: 0 5px 5px 0;
                padding: .4rem .6rem; margin: .5rem 0; font-size: 12px; line-height: 1.4; }
  #violations b { display: block; color: #c0392b; margin-bottom: .15rem; }
  #violations ul { margin: 0; padding-left: 1.1rem; }
  .notice { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem;
            border-left: 3px solid #b3462f; background: #fff7f0; color: #b3462f; border-radius: 0 5px 5px 0;
            padding: .3rem .5rem; margin: .5rem 0; font-size: 12px; line-height: 1.4; }
  .notice button { padding: 0 .35rem; font-size: 12px; line-height: 1.3; color: inherit; }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  [hidden] { display: none !important; }
</style>

<aside>
  <div class="langs"><button id="langPl">PL</button><button id="langEn">EN</button></div>
  <h1 data-i18n="title">Generator lab</h1>
  <p class="sub" data-i18n="subtitle">Same engine as carve.ts: engine.ts.</p>

  <div class="views labonly"><button id="viewSimple" type="button"></button><button id="viewAdvanced" type="button"></button></div>
  <div id="simple" class="labonly">
    <div id="simpleSize"></div>
    <div id="simpleGroups"></div>
    <div class="row">
      <label for="sSeed" id="sSeedLabel"></label>
      <input type="number" id="sSeed" min="0" max="999999" step="1">
    </div>
    <label class="check"><input type="checkbox" id="sRandom"> <span data-simple="randomize"></span></label>
    <p class="grouphelp" data-simple="randomizeHelp"></p>
  </div>

  <select id="presets" class="presets labonly"></select>
  <div class="notice labonly" id="clampNote" hidden><span data-i18n="clamped"></span><button id="clampDismiss" type="button">×</button></div>
  <div id="violations" class="labonly" hidden><b data-i18n="violationsTitle"></b><ul></ul></div>

  <div class="command libonly" id="libCommandBox" hidden>
    <div class="cmdhead"><span data-i18n="boardCommand">Command of this board</span>
      <button id="libCopy" data-i18n="copy">Copy</button></div>
    <pre id="libCommand"></pre>
  </div>

  <div class="buttons labonly">
    <button class="primary" id="run" data-i18n="generate">Generate</button>
    <button id="reseed" data-i18n="reseed">New seed</button>
    <button id="reset" data-i18n="reset">Defaults</button>
    <button id="download" data-i18n="downloadSvg">Download SVG</button>
    <button id="abort" hidden data-i18n="abort">Abort</button>
  </div>

  <div class="command labonly">
    <div class="cmdhead"><span data-i18n="commandHead">CLI command (matches the current settings)</span>
      <button id="copyCommand" data-i18n="copy">Copy</button></div>
    <pre id="command"></pre>
  </div>

  <h2 data-i18n="preview">Preview</h2>
  <div class="row labonly advonly">
    <label for="cell" data-i18n="cellLabel">cell size in export (px)</label>
    <input type="number" id="cell" value="12" min="1" max="40" step="1">
    <p class="help" data-i18n="cellHelp"></p>
  </div>
  <div class="row labonly">
    <label for="stroke" data-i18n="strokeLabel">stroke width (grid units)</label>
    <input type="number" id="stroke" value="0.5" min="0.2" max="0.9" step="0.05">
  </div>
  <div class="row labonly">
    <label for="headWidth" data-i18n="headWidthLabel">arrowhead width (grid units, 0 = automatic)</label>
    <input type="number" id="headWidth" value="0" min="0" max="0.9" step="0.05">
  </div>
  <div class="row labonly">
    <label for="headHeight" data-i18n="headHeightLabel">arrowhead height (grid units)</label>
    <input type="number" id="headHeight" value="1" min="0.1" max="1" step="0.05">
    <p class="help" data-i18n="headHelp"></p>
  </div>
  <label class="check labonly"><input type="checkbox" id="rounded" checked> <span data-i18n="rounded">round the corners</span></label>
  <label class="check labonly"><input type="checkbox" id="colored"> <span data-i18n="colored">colour the arrows</span></label>
  <div id="libView" class="libonly" hidden>
    <div class="row">
      <label for="libStroke" data-i18n="strokeLabel">stroke width (grid units)</label>
      <input type="number" id="libStroke" value="0.5" min="0.2" max="0.9" step="0.05">
    </div>
    <div class="row">
      <label for="libHeadWidth" data-i18n="headWidthLabel">arrowhead width (grid units, 0 = automatic)</label>
      <input type="number" id="libHeadWidth" value="0" min="0" max="0.9" step="0.05">
    </div>
    <div class="row">
      <label for="libHeadHeight" data-i18n="headHeightLabel">arrowhead height (grid units)</label>
      <input type="number" id="libHeadHeight" value="1" min="0.1" max="1" step="0.05">
      <p class="help" data-i18n="headHelp"></p>
    </div>
    <label class="check"><input type="checkbox" id="libRounded" checked> <span data-i18n="rounded">round the corners</span></label>
    <label class="check"><input type="checkbox" id="libColored"> <span data-i18n="colored">colour the arrows</span></label>
  </div>
  <label class="check labonly"><input type="checkbox" id="hilite" checked> <span data-i18n="hilite">highlight the longest pieces</span></label>
  <label class="check labonly advonly"><input type="checkbox" id="voids" checked> <span data-i18n="voids">show jammed cells</span></label>
  <div class="row labonly advonly">
    <label for="top" data-i18n="topLabel">how many longest</label>
    <input type="number" id="top" value="5" min="1" max="50" step="1">
  </div>
  <label class="check labonly advonly"><input type="checkbox" id="auto"> <span data-i18n="autoRun">generate right after a change</span></label>
  <label class="check labonly advonly"><input type="checkbox" id="help" checked> <span data-i18n="showHelp">show parameter descriptions</span></label>

  <div id="params" class="labonly"></div>
</aside>

<main>
  <button id="solo">⤢</button>
  <div class="tabs" id="tabs">
    <button data-tab="lab" class="on" data-i18n="tabLab">Lab</button>
    <button data-tab="library" data-i18n="tabLibrary">Saved boards</button>
  </div>
  <div class="status" id="status"></div>
  <div id="progress"><div id="bar"></div></div>
  <div class="cols">
    <div id="boardWrap"><arrowz-board id="board" enable-colors></arrowz-board></div>
    <div id="side">
      <table class="stats" id="stats"></table>
      <div id="topTable"></div>
      <div id="library" hidden>
        <div class="libhead">
          <div class="presets" id="libSizes"></div>
          <button id="libRefresh" data-i18n="refresh">Refresh</button>
        </div>
        <div id="libList"></div>
        <div id="libDetail" hidden>
          <div class="buttons"><button id="libLoad" data-i18n="loadIntoLab">Load into lab</button>
            <button id="libDelete" class="danger" data-i18n="deleteBoard">Delete from disk</button></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="./dist/lab-page.js"></script>
</html>
