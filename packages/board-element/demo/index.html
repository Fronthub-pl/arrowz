<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arrowz-board demo</title>
  <style>
    html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: #232447; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
    main { min-width: 0; }
    arrowz-board { width: 100%; height: 100%; }

    aside { display: flex; flex-direction: column; overflow: auto; background: #fff; border-left: 1px solid #ddd; }
    section { padding: 10px 12px; border-bottom: 1px solid #eee; }
    section.grow { flex: 1; display: flex; flex-direction: column; min-height: 200px; border-bottom: 0; }
    h2 {
      display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #6b6c8a;
    }
    h2 .note { text-transform: none; letter-spacing: 0; font-weight: 400; color: #9a9ab4; }

    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button { font: inherit; padding: 3px 8px; border: 1px solid #c9c9d6; border-radius: 4px; background: #f6f6fa; cursor: pointer; }
    button:hover:not(:disabled) { background: #ececf4; }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { margin-left: auto; font-size: 11px; padding: 1px 6px; text-transform: none; letter-spacing: 0; }
    input, select { font: inherit; }
    input[type=number] { width: 5.5em; }
    input[type=color] { width: 3em; height: 1.6em; padding: 0; }
    .stats { margin: 8px 0 0; font-size: 12px; color: #6b6c8a; font-variant-numeric: tabular-nums; white-space: pre-wrap; }

    .controls { display: grid; gap: 7px; }
    .control { display: grid; grid-template-columns: 10.5em auto; align-items: center; column-gap: 8px; }
    .control .name { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .control input, .control select { justify-self: start; }
    .control .hint { grid-column: 1 / -1; font-size: 11px; color: #9a9ab4; }

    #snippet {
      margin: 0; padding: 8px; background: #f6f6fa; border: 1px solid #eee; border-radius: 4px;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-bottom: 6px; font-size: 11px; }
    .filter { display: inline-flex; gap: 3px; align-items: center; }
    .console {
      flex: 1; min-height: 120px; overflow: auto; padding: 4px 6px;
      background: #f6f6fa; border: 1px solid #eee; border-radius: 4px;
      font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .event { display: flex; gap: 6px; align-items: baseline; }
    .event .time, .event .type, .event .count { flex: none; white-space: nowrap; }
    .event .time { color: #9a9ab4; }
    .event .type { font-weight: 600; }
    .event .detail { flex: 1; min-width: 0; word-break: break-word; }
    .event .count { margin-left: auto; color: #9a9ab4; }
    .type-piece-click { color: #4a7cff; }
    .type-piece-removed { color: #17916b; }
    .type-life-lost { color: #e8467c; }
    .type-finished { color: #8a5cf6; }
    .type-viewport-change { color: #9a9ab4; }

    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
      aside { border-left: 0; border-top: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <main><arrowz-board id="board"></arrowz-board></main>
  <aside>
    <section>
      <h2>Board</h2>
      <div class="row">
        <label>Preset <select id="preset"></select></label>
        <label>Seed <input id="seed" type="number" value="7" min="0"></label>
        <button id="generate" type="button">Generate</button>
      </div>
      <p id="stats" class="stats">idle</p>
    </section>

    <section>
      <h2>Attributes</h2>
      <div id="attrs" class="controls"></div>
    </section>

    <section>
      <h2>view <span class="note">a property; no attribute mirrors it</span></h2>
      <div id="view-controls" class="controls"></div>
    </section>

    <section>
      <h2>Methods</h2>
      <div class="row">
        <button id="fit" type="button">fit()</button>
        <button id="save" type="button">saveState()</button>
        <button id="load" type="button" disabled>loadState()</button>
        <button id="restart" type="button">restart()</button>
        <button id="measure" type="button">Measure pan and zoom</button>
      </div>
      <p id="session" class="stats">lives: 3 · left: —</p>
    </section>

    <section>
      <h2>HTML <button id="copy" class="ghost" type="button">Copy</button></h2>
      <pre id="snippet"></pre>
    </section>

    <section class="grow">
      <h2>Events <button id="clear" class="ghost" type="button">Clear</button></h2>
      <div id="filters" class="filters"></div>
      <div id="console" class="console"></div>
    </section>
  </aside>
  <script type="module" src="./main.ts"></script>
</body>
</html>
