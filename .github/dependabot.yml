# The workflow pins actions by commit; Dependabot proposes the new commit when a tag moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The pnpm workspace, read from its root. A minor or patch update changes
  # the lockfile only, so the range a published package asks for is raised by
  # hand, with a changeset. Major updates come one by one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    # TypeScript 7.0 ships no compiler API, and typescript-eslint and the
    # board element's README test both read the code through it.
    ignore:
      - dependency-name: typescript
        versions: ['>=7.0.0']
