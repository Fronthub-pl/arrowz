name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '~2.9'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # The key names the browser build, not just the lockfile: the perf
          # test needs the full Chromium rather than the headless shell, and
          # the lockfile does not change when that choice does. Without the
          # marker the old shell-only cache would restore on every run and the
          # browser would be downloaded again each time, never saved.
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      # The full Chromium, not `--only-shell`: vitest.config.ts runs the browser
      # project on the real Chrome engine, which the headless shell is not.
      - run: pnpm --filter @fronthub/arrowz-board exec playwright install --with-deps chromium

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5

      - run: pnpm nx affected -t check lint fmt test build smoke pack-check

  # Advisory: the store starts through a Deno program so that it needs no
  # shell, and only a Windows runner shows that it does not.
  store-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '~2.9'

      # No type check: the types of `node:` imports come from node_modules,
      # which this job does not install. The Linux job checks them.
      - run: deno test --no-check --allow-read --allow-write --allow-env --allow-run --allow-net packages/cli/store-start.test.ts

  # PROBE, not for merging: what the whole test task does on Windows, with and
  # without Git's Unix tools on PATH, and with the default and LF line endings.
  probe-windows-tests:
    name: probe (${{ matrix.tools }}, ${{ matrix.eol }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        tools: [git-bash, plain]
        eol: [default, lf]
    steps:
      - if: matrix.eol == 'lf'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '~2.9'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - shell: pwsh
        run: |
          "PROBE pnpm=$(pnpm --version)"
          pnpm install --frozen-lockfile
          "PROBE install exit=$LASTEXITCODE"
          "PROBE node_modules exists=$(Test-Path node_modules)"
          "PROBE @types/node exists=$(Test-Path node_modules/@types/node)"
          "PROBE @types/node/package.json exists=$(Test-Path node_modules/@types/node/package.json)"
          if (Test-Path node_modules) { "PROBE node_modules entries=$((Get-ChildItem node_modules -Force | Select-Object -ExpandProperty Name) -join ',')" }
          if (Test-Path node_modules/@types) { Get-ChildItem node_modules/@types -Force | ForEach-Object { "PROBE @types entry=$($_.Name) type=$($_.LinkType) target=$($_.Target)" } }

      - if: matrix.tools == 'plain'
        shell: pwsh
        run: |
          $keep = ($env:PATH -split ';') | Where-Object { $_ -notmatch '\\Git\\(usr\\bin|bin|mingw64\\bin)\\?$' -and $_ -notmatch 'msys' }
          "PATH=$($keep -join ';')" >> $env:GITHUB_ENV

      - shell: pwsh
        run: |
          "PROBE autocrlf=$(git config --get core.autocrlf)"
          "PROBE README has CRLF=$((Get-Content -Raw README.md) -match "`r`n")"
          foreach ($tool in 'sh', 'bash', 'mktemp', 'rm', 'git', 'printf') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue | Select-Object -First 1
            "PROBE tool $tool=$(if ($found) { $found.Source } else { 'absent' })"
          }

      - name: The task as it is, type check included
        continue-on-error: true
        run: deno task test

      - name: The tests alone, without the type check
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-run --allow-net packages/

  # Advisory: a missing changeset is a warning on the pull request, never a
  # failed check. Anything else the command fails on (a changeset naming an
  # unknown package, a broken config) does fail the job.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Changeset status
        run: |
          set +e
          out=$(pnpm changeset status --since=origin/main 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if echo "$out" | grep -q 'no changesets were found'; then
            echo "::warning title=No changeset::This pull request changes a published package and adds no changeset. Run 'pnpm changeset' (or 'pnpm changeset --empty' if nothing needs a release); a maintainer can also add it before the release."
            exit 0
          fi
          exit "$code"
