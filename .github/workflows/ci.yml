name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: '~2.9'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # The key names the browser build, not just the lockfile: the perf
          # test needs the full Chromium rather than the headless shell, and
          # the lockfile does not change when that choice does. Without the
          # marker the old shell-only cache would restore on every run and the
          # browser would be downloaded again each time, never saved.
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      # The full Chromium, not `--only-shell`: vitest.config.ts runs the browser
      # project on the real Chrome engine, which the headless shell is not.
      - run: pnpm --filter @arrowz/board-element exec playwright install --with-deps chromium

      - uses: nrwl/nx-set-shas@v5

      - run: pnpm nx affected -t check lint fmt test build smoke bundle
