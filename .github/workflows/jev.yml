name: Jev guards

# Advisory only: the job never fails a PR (see docs/jev-guards.md). Apart from
# CI because an edit of the PR text must not rerun the whole build.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: jev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      # The PR's head, not the merge commit: the diff's line numbers must match the files read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '~2.9'

      - name: Ask Jev
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: >-
          deno run
          --allow-net=api.typesafe.ai
          --allow-read
          --allow-env=TYPESAFE_API_KEY,GITHUB_EVENT_PATH,GITHUB_STEP_SUMMARY
          --allow-run=git
          --allow-write="$GITHUB_STEP_SUMMARY"
          packages/cli/scripts/jev-ci.ts
